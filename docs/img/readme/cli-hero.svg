<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="unity-mcp-cli: install Unity and the AI Game Developer plugin, connect AI agents, run tools, compile and test Unity projects from the terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }

    .gl { pointer-events: none; }
    .gl-r { fill: #FF2448; opacity: 0; animation: glr 2.8s steps(1) infinite; }
    .gl-c { fill: #2EE6FF; opacity: 0; animation: glc 2.8s steps(1) infinite; }
    .gl-s { opacity: 0; animation: gls 2.8s steps(1) infinite; }
    .gl-base { animation: glb 2.8s steps(1) infinite; }
    @keyframes glr { 0% { opacity:.75; transform:translate(-2px,0) } 6% { transform:translate(-4px,1px) } 9% { transform:translate(-1px,-1px) }
      12% { opacity:.55; transform:translate(-2px,0) } 40% { opacity:.85; transform:translate(-6px,1px) } 43% { transform:translate(3px,-1px) }
      46% { opacity:.55; transform:translate(-2px,0) } 72% { opacity:.9; transform:translate(-5px,2px) } 75% { transform:translate(-1px,0) } 78% { opacity:.6; transform:translate(-2px,0) } }
    @keyframes glc { 0% { opacity:.7; transform:translate(2px,0) } 6% { transform:translate(4px,-1px) } 9% { transform:translate(1px,1px) }
      12% { opacity:.5; transform:translate(2px,0) } 40% { opacity:.85; transform:translate(6px,-1px) } 43% { transform:translate(-3px,1px) }
      46% { opacity:.5; transform:translate(2px,0) } 72% { opacity:.9; transform:translate(5px,-2px) } 75% { transform:translate(1px,0) } 78% { opacity:.55; transform:translate(2px,0) } }
    @keyframes gls { 0%,39%,47%,71%,79%,100% { opacity:0; transform:none } 40% { opacity:1; transform:translate(9px,0) } 43% { opacity:1; transform:translate(-7px,0) }
      72% { opacity:1; transform:translate(-10px,0) } 75% { opacity:1; transform:translate(6px,0) } }
    @keyframes glb { 0%,100% { transform:none } 40% { transform:translate(1px,0) } 43% { transform:translate(-1px,0) } 46% { transform:none }
      72% { transform:translate(-1px,1px) } 75% { transform:none } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#bg)"/><rect width="1200" height="380" fill="url(#hzR)"/><rect width="1200" height="380" fill="url(#hzB)"/>
    <rect width="1200" height="380" fill="url(#dots)"/>
    <text x="64" y="104" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">AI GAME DEVELOPER · UNITY</text><text x="64" y="176" class="s" font-size="68" font-weight="800" letter-spacing="-2" fill="#FAFFFD">unity-mcp-<tspan fill="#FF5A73">cli</tspan></text><text x="64" y="226" class="s" font-size="22" fill="#A8C2D2">Install Unity and the plugin, connect AI agents,</text><text x="64" y="258" class="s" font-size="22" fill="#A8C2D2">run tools, compile and test from the terminal.</text><g transform="translate(64 304)"><rect width="169" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="84.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Node.js 22.14+</text></g><g transform="translate(243 304)"><rect width="101" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="50.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Windows</text></g><g transform="translate(354 304)"><rect width="81" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="40.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">macOS</text></g><g transform="translate(445 304)"><rect width="81" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="40.5" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">Linux</text></g><g transform="translate(536 304)"><rect width="52" height="34" rx="17" fill="#0D1A25" stroke="rgba(111,168,208,0.45)" stroke-opacity=".6"/><text x="26.0" y="23" text-anchor="middle" class="m" font-size="16" fill="#A8C2D2">CI</text></g><circle cx="970" cy="190.0" r="93.60000000000001" fill="url(#logoGlow)"/><circle class="spin" cx="970" cy="190.0" r="98.8" fill="none" stroke="#FF5A73" stroke-opacity=".35" stroke-dasharray="2 10"/><circle class="spin r" cx="970" cy="190.0" r="126.88" fill="none" stroke="#6FA8D0" stroke-opacity=".25" stroke-dasharray="36 18"/><g class="pulse"><g transform="translate(867.60 91.00) scale(0.2000)"><path d="M512 194 L512 504 L366 785 L185 785 Z" fill="url(#logoL)"/><path d="M512 194 L839 785 L658 785 L512 504 Z" fill="url(#logoR)"/><path d="M512 194 L512 294 L223 767 L185 785 Z" fill="url(#logoB)"/></g></g>
    <rect x="0" y="378" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
