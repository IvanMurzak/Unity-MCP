<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="How it works: an AI agent or unity-mcp-cli talks MCP to a server (ai-game.dev Cloud by default, or a local gamedev-mcp-server), which calls the tools of your running game and of the Unity Editor plugin; the CLI also installs the plugin, opens the project and runs batch-mode tests directly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="470" rx="20"/></clipPath>
    <path id="w1" d="M300 150 C350 150 360 215 420 215"/>
    <path id="w2" d="M300 320 C350 320 360 255 420 255"/>
    <path id="w3" d="M780 215 C830 215 840 150 900 150"/>
    <path id="w4" d="M780 255 C830 255 840 320 900 320"/>
    <path id="w5" d="M160 360 C160 430 1040 430 1040 362"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .head { font-size: 12px; letter-spacing: 2px; fill: #64748b; font-weight: 700; }
    .card { fill: #0f172a; stroke: #1e293b; }
    .t1 { font-size: 16px; font-weight: 600; fill: #e2e8f0; }
    .t2 { font-size: 13px; fill: #94a3b8; }
    .t3 { font-size: 12px; fill: #64748b; }
    .wire { fill: none; stroke-width: 1.6; stroke-dasharray: 4 6; }
    .lbl { font-size: 11px; fill: #94a3b8; }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)" class="sans">
    <rect width="1200" height="470" fill="url(#bg)"/>
    <rect width="1200" height="470" fill="url(#dots)"/>

    <text x="40" y="58" class="head">YOU AND YOUR AGENT</text>
    <text x="420" y="58" class="head">MCP SERVER</text>
    <text x="900" y="58" class="head">UNITY</text>

    <!-- wires -->
    <g>
      <use href="#w1" class="wire" stroke="#22d3ee"/>
      <use href="#w2" class="wire" stroke="#34d399"/>
      <use href="#w3" class="wire" stroke="#e879f9"/>
      <use href="#w4" class="wire" stroke="#a5b4fc"/>
      <use href="#w5" class="wire" stroke="#34d399" stroke-opacity=".5"/>
    </g>
    <g>
      <circle r="3.5" fill="#22d3ee"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
      <circle r="3.5" fill="#34d399"><animateMotion dur="2.2s" begin=".6s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
      <circle r="3.5" fill="#e879f9"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
      <circle r="3.5" fill="#a5b4fc"><animateMotion dur="2.2s" begin="1.6s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
      <circle r="3" fill="#34d399"><animateMotion dur="5s" begin=".4s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
    </g>
    <text x="316" y="204" class="lbl">MCP</text>
    <text x="316" y="276" class="lbl">HTTP</text>
    <text x="792" y="168" class="lbl">SignalR</text>
    <text x="792" y="306" class="lbl">SignalR</text>
    <text x="600" y="446" text-anchor="middle" class="lbl">install-plugin · open · test (batch mode)</text>

    <!-- left column -->
    <rect x="40" y="90" width="260" height="120" rx="12" class="card"/>
    <rect x="40" y="90" width="4" height="120" rx="2" fill="#22d3ee"/>
    <text x="60" y="120" class="t1">AI agent</text>
    <text x="60" y="144" class="t2">Claude Code, Codex, Cursor,</text>
    <text x="60" y="164" class="t2">Copilot, Gemini, Rider, …</text>
    <text x="60" y="192" class="t3">MCP tools or generated Skills</text>

    <rect x="40" y="250" width="260" height="110" rx="12" class="card"/>
    <rect x="40" y="250" width="4" height="110" rx="2" fill="#34d399"/>
    <text x="60" y="280" class="mono t1">unity-mcp-cli</text>
    <text x="60" y="304" class="t2">install, open, rql, run-tool,</text>
    <text x="60" y="324" class="t2">compile, test, setup-skills</text>
    <text x="60" y="346" class="t3">scripts and CI</text>

    <!-- middle column -->
    <rect x="420" y="90" width="360" height="290" rx="14" fill="#0f172a" stroke="url(#edge)" stroke-width="1.5" class="glow"/>
    <text x="444" y="124" class="t1">Routes calls to your project</text>
    <text x="444" y="146" class="t2">Tools, prompts and resources from Unity</text>

    <rect x="444" y="168" width="312" height="84" rx="10" fill="#111c35" stroke="#273454"/>
    <text x="462" y="194" class="t1">Cloud <tspan class="t3">(default)</tspan></text>
    <text x="462" y="216" class="mono t2">https://ai-game.dev/mcp</text>
    <text x="462" y="238" class="t3">sign in once with unity-mcp-cli login</text>

    <rect x="444" y="268" width="312" height="90" rx="10" fill="#111c35" stroke="#273454"/>
    <text x="462" y="294" class="t1">Custom <tspan class="t3">(local or self-hosted)</tspan></text>
    <text x="462" y="316" class="mono t2">gamedev-mcp-server</text>
    <text x="462" y="338" class="t3">stdio or HTTP · binary or Docker</text>

    <!-- right column -->
    <rect x="900" y="90" width="260" height="120" rx="12" class="card"/>
    <rect x="900" y="90" width="4" height="120" rx="2" fill="#e879f9"/>
    <text x="920" y="120" class="t1">Your game (Runtime)</text>
    <text x="920" y="144" class="t2">your [AiTool] methods,</text>
    <text x="920" y="164" class="t2">in a build or in Play mode</text>
    <text x="920" y="192" class="t3">NPC logic, live debugging</text>

    <rect x="900" y="250" width="260" height="110" rx="12" class="card"/>
    <rect x="900" y="250" width="4" height="110" rx="2" fill="#a5b4fc"/>
    <text x="920" y="280" class="t1">Unity Editor plugin</text>
    <text x="920" y="304" class="t2">RQL, C# scripts, tests,</text>
    <text x="920" y="324" class="t2">screenshots, packages</text>
    <text x="920" y="346" class="t3">plus extensions and your tools</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
