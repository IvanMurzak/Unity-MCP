<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="How it works: an AI agent or unity-mcp-cli talks to an MCP server (ai-game.dev Cloud by default, or a local gamedev-mcp-server), which calls the tools of your running game and of the Unity Editor plugin; the CLI also installs the plugin, opens the project and runs batch-mode tests directly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151036"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="520" rx="20"/></clipPath>
    <path id="w1" d="M284 150 C324 150 324 190 364 190"/>
    <path id="w2" d="M284 350 C324 350 324 310 364 310"/>
    <path id="w3" d="M636 190 C676 190 676 150 716 150"/>
    <path id="w4" d="M636 310 C676 310 676 350 716 350"/>
    <path id="w5" d="M154 426 C154 478 846 478 846 426"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .head { font-size: 14px; letter-spacing: 2px; fill: #94a3b8; font-weight: 700; }
    .card { fill: #0f172a; stroke: #1e293b; }
    .t1 { font-size: 20px; font-weight: 600; fill: #f1f5f9; }
    .t2 { font-size: 16px; fill: #cbd5e1; }
    .t3 { font-size: 15px; fill: #94a3b8; }
    .wire { fill: none; stroke-width: 2; stroke-dasharray: 5 6; }
    .lbl { font-size: 14px; font-weight: 600; fill: #cbd5e1; }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .6; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)" class="sans">
    <rect width="1000" height="520" fill="url(#bg)"/>
    <rect width="1000" height="520" fill="url(#dots)"/>

    <text x="24" y="52" class="head">YOU</text>
    <text x="364" y="52" class="head">MCP SERVER</text>
    <text x="716" y="52" class="head">UNITY</text>

    <!-- wires -->
    <g>
      <use href="#w1" class="wire" stroke="#22d3ee"/>
      <use href="#w2" class="wire" stroke="#34d399"/>
      <use href="#w3" class="wire" stroke="#e879f9"/>
      <use href="#w4" class="wire" stroke="#a5b4fc"/>
      <use href="#w5" class="wire" stroke="#34d399" stroke-opacity=".6"/>
    </g>
    <g>
      <circle r="4" fill="#22d3ee"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle>
      <circle r="4" fill="#e879f9"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle>
      <circle r="4" fill="#a5b4fc"><animateMotion dur="2s" begin="1.5s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle>
      <circle r="3.5" fill="#34d399"><animateMotion dur="5s" begin=".3s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle>
    </g>
    <text x="300" y="136" class="lbl">MCP</text>
    <text x="296" y="380" class="lbl">HTTP</text>
    <text x="640" y="136" class="lbl">SignalR</text>
    <text x="640" y="380" class="lbl">SignalR</text>
    <text x="500" y="506" text-anchor="middle" class="t3">CLI direct: install-plugin · open · test (batch mode)</text>

    <!-- left column -->
    <rect x="24" y="80" width="260" height="150" rx="12" class="card"/>
    <rect x="24" y="80" width="5" height="150" rx="2" fill="#22d3ee"/>
    <text x="46" y="114" class="t1">AI agent</text>
    <text x="46" y="144" class="t2">Claude Code, Codex,</text>
    <text x="46" y="168" class="t2">Cursor, Copilot, Gemini…</text>
    <text x="46" y="204" class="t3">MCP tools or Skills</text>

    <rect x="24" y="276" width="260" height="150" rx="12" class="card"/>
    <rect x="24" y="276" width="5" height="150" rx="2" fill="#34d399"/>
    <text x="46" y="310" class="mono t1">unity-mcp-cli</text>
    <text x="46" y="340" class="t2">install, open, rql,</text>
    <text x="46" y="364" class="t2">compile, test, skills</text>
    <text x="46" y="400" class="t3">scripts and CI</text>

    <!-- middle column -->
    <rect x="364" y="80" width="272" height="346" rx="14" fill="#0f172a" stroke="url(#edge)" stroke-width="2" class="glow"/>
    <text x="386" y="114" class="t1">MCP server</text>
    <text x="386" y="140" class="t3">routes calls to your project</text>

    <rect x="384" y="160" width="232" height="114" rx="10" fill="#111c35" stroke="#334155"/>
    <text x="402" y="192" class="t1">Cloud <tspan class="t3">(default)</tspan></text>
    <text x="402" y="222" class="mono t2">ai-game.dev/mcp</text>
    <text x="402" y="252" class="t3">unity-mcp-cli login</text>

    <rect x="384" y="290" width="232" height="114" rx="10" fill="#111c35" stroke="#334155"/>
    <text x="402" y="322" class="t1">Custom</text>
    <text x="402" y="352" class="mono t2">gamedev-mcp-server</text>
    <text x="402" y="382" class="t3">local, hosted, Docker</text>

    <!-- right column -->
    <rect x="716" y="80" width="260" height="150" rx="12" class="card"/>
    <rect x="716" y="80" width="5" height="150" rx="2" fill="#e879f9"/>
    <text x="738" y="114" class="t1">Your game</text>
    <text x="738" y="144" class="t2">your [AiTool] methods</text>
    <text x="738" y="168" class="t2">in a build or Play mode</text>
    <text x="738" y="204" class="t3">NPC logic, debugging</text>

    <rect x="716" y="276" width="260" height="150" rx="12" class="card"/>
    <rect x="716" y="276" width="5" height="150" rx="2" fill="#a5b4fc"/>
    <text x="738" y="310" class="t1">Unity Editor</text>
    <text x="738" y="340" class="t2">RQL, C#, tests,</text>
    <text x="738" y="364" class="t2">screenshots, packages</text>
    <text x="738" y="400" class="t3">+ extensions, your tools</text>
  </g>
  <rect x=".5" y=".5" width="999" height="519" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
