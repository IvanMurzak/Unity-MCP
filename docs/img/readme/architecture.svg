<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="How it works: an AI agent or unity-mcp-cli talks to an MCP server (ai-game.dev Cloud by default, or a local gamedev-mcp-server), which calls the tools of your running game and of the Unity Editor plugin; the CLI also installs the plugin, opens the project and runs batch-mode tests directly">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080F17"/><stop offset="1" stop-color="#030609"/></linearGradient>
    <radialGradient id="hzR" cx="0.18" cy="0" r="0.6"><stop offset="0" stop-color="#FF002A" stop-opacity="0.16"/><stop offset="1" stop-color="#FF002A" stop-opacity="0"/></radialGradient>
    <radialGradient id="hzB" cx="0.85" cy="0" r="0.6"><stop offset="0" stop-color="#3B9BFF" stop-opacity="0.14"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A8C2D2" fill-opacity="0.08"/></pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF002A" stop-opacity="0"/><stop offset="0.3" stop-color="#FF2448" stop-opacity="0.6"/><stop offset="0.7" stop-color="#3B9BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#3B9BFF" stop-opacity="0"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1620"/><stop offset="1" stop-color="#070D14"/></linearGradient>
    <linearGradient id="logoL" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#8395AD"/></linearGradient>
    <linearGradient id="logoR" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#E1E8F1"/><stop offset="1" stop-color="#455974"/></linearGradient>
    <linearGradient id="logoB" gradientUnits="userSpaceOnUse" x1="512" y1="190" x2="512" y2="785"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#AABBD0"/></linearGradient>
    <radialGradient id="logoGlow"><stop offset="0" stop-color="#6FA8D0" stop-opacity=".18"/><stop offset="1" stop-color="#6FA8D0" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A73"/><stop offset="1" stop-color="#6FA8D0"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="520" rx="18"/></clipPath>
  </defs>
  <style>
    .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; } .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; white-space: pre; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin.r { animation-duration: 60s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .blink { animation: blink 1.1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0; } }

    .gl { pointer-events: none; }
    .gl-r { fill: #FF2448; opacity: 0; animation: glr 2.8s steps(1) infinite; }
    .gl-c { fill: #2EE6FF; opacity: 0; animation: glc 2.8s steps(1) infinite; }
    .gl-s { opacity: 0; animation: gls 2.8s steps(1) infinite; }
    .gl-base { animation: glb 2.8s steps(1) infinite; }
    @keyframes glr { 0% { opacity:.75; transform:translate(-2px,0) } 6% { transform:translate(-4px,1px) } 9% { transform:translate(-1px,-1px) }
      12% { opacity:.55; transform:translate(-2px,0) } 40% { opacity:.85; transform:translate(-6px,1px) } 43% { transform:translate(3px,-1px) }
      46% { opacity:.55; transform:translate(-2px,0) } 72% { opacity:.9; transform:translate(-5px,2px) } 75% { transform:translate(-1px,0) } 78% { opacity:.6; transform:translate(-2px,0) } }
    @keyframes glc { 0% { opacity:.7; transform:translate(2px,0) } 6% { transform:translate(4px,-1px) } 9% { transform:translate(1px,1px) }
      12% { opacity:.5; transform:translate(2px,0) } 40% { opacity:.85; transform:translate(6px,-1px) } 43% { transform:translate(-3px,1px) }
      46% { opacity:.5; transform:translate(2px,0) } 72% { opacity:.9; transform:translate(5px,-2px) } 75% { transform:translate(1px,0) } 78% { opacity:.55; transform:translate(2px,0) } }
    @keyframes gls { 0%,39%,47%,71%,79%,100% { opacity:0; transform:none } 40% { opacity:1; transform:translate(9px,0) } 43% { opacity:1; transform:translate(-7px,0) }
      72% { opacity:1; transform:translate(-10px,0) } 75% { opacity:1; transform:translate(6px,0) } }
    @keyframes glb { 0%,100% { transform:none } 40% { transform:translate(1px,0) } 43% { transform:translate(-1px,0) } 46% { transform:none }
      72% { transform:translate(-1px,1px) } 75% { transform:none } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="520" fill="url(#bg)"/><rect width="1200" height="520" fill="url(#hzR)"/><rect width="1200" height="520" fill="url(#hzB)"/>
    <rect width="1200" height="520" fill="url(#dots)"/>
    <text x="40" y="64" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">YOU</text><text x="430" y="64" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">MCP SERVER</text><text x="860" y="64" text-anchor="start" class="s" font-size="16" font-weight="700" letter-spacing="2.4" fill="#FF5A73">UNITY</text><rect x="430" y="90" width="340" height="320" rx="18" fill="none" stroke="rgba(111,168,208,0.45)" stroke-dasharray="6 6"/><path id="w1" d="M340 170 C385 170 385 230 430 230" fill="none" stroke="#FF5A73" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#FF5A73"><animateMotion dur="2.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#w1"/></animateMotion></circle><path id="w2" d="M340 330 C385 330 385 270 430 270" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="2.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#w2"/></animateMotion></circle><path id="w3" d="M770 230 C815 230 815 170 860 170" fill="none" stroke="#EAB308" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#EAB308"><animateMotion dur="2.2s" begin="-0.5s" repeatCount="indefinite"><mpath href="#w3"/></animateMotion></circle><path id="w4" d="M770 270 C815 270 815 330 860 330" fill="none" stroke="#6FA8D0" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#6FA8D0"><animateMotion dur="2.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#w4"/></animateMotion></circle><path id="w5" d="M190 390 C190 456 1010 456 1010 390" fill="none" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="4 6"/><circle r="4" fill="#22C55E"><animateMotion dur="5.0s" begin="-0.3s" repeatCount="indefinite"><mpath href="#w5"/></animateMotion></circle><text x="352" y="156" text-anchor="start" class="s" font-size="16" fill="#A8C2D2">MCP</text><text x="350" y="362" text-anchor="start" class="s" font-size="16" fill="#A8C2D2">HTTP</text><text x="778" y="156" text-anchor="start" class="s" font-size="16" fill="#A8C2D2">SignalR</text><text x="778" y="362" text-anchor="start" class="s" font-size="16" fill="#A8C2D2">SignalR</text><rect x="40" y="110" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="122" width="3" height="96" rx="1.5" fill="#FF5A73"/><text x="62" y="166.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">AI agent</text><text x="62" y="192.0" class="s" font-size="16" fill="#8AA6B8">Claude Code, Codex, Cursor,</text><text x="62" y="214.0" class="s" font-size="16" fill="#8AA6B8">Copilot, Gemini and more</text><rect x="40" y="270" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="40" y="282" width="3" height="96" rx="1.5" fill="#22C55E"/><text x="62" y="326.0" class="m" font-size="19" font-weight="700" fill="#FAFFFD">unity-mcp-cli</text><text x="62" y="352.0" class="s" font-size="16" fill="#8AA6B8">install · open · rql · test</text><text x="62" y="374.0" class="s" font-size="16" fill="#8AA6B8">scripts and CI</text><rect x="450" y="110" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><text x="468" y="166.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Cloud (default)</text><text x="468" y="192.0" class="s" font-size="16" fill="#8AA6B8">ai-game.dev/mcp</text><text x="468" y="214.0" class="s" font-size="16" fill="#8AA6B8">sign in: unity-mcp-cli login</text><rect x="450" y="270" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><text x="468" y="326.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Custom</text><text x="468" y="352.0" class="s" font-size="16" fill="#8AA6B8">local gamedev-mcp-server</text><text x="468" y="374.0" class="s" font-size="16" fill="#8AA6B8">self-hosted or Docker</text><rect x="860" y="110" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="860" y="122" width="3" height="96" rx="1.5" fill="#EAB308"/><text x="882" y="166.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Your game (Runtime)</text><text x="882" y="192.0" class="s" font-size="16" fill="#8AA6B8">your [AiTool] methods</text><text x="882" y="214.0" class="s" font-size="16" fill="#8AA6B8">in a build or in Play mode</text><rect x="860" y="270" width="300" height="120" rx="14" fill="url(#card)" stroke="rgba(111,168,208,0.16)"/><rect x="860" y="282" width="3" height="96" rx="1.5" fill="#6FA8D0"/><text x="882" y="326.0" class="s" font-size="20" font-weight="700" fill="#FAFFFD">Unity Editor plugin</text><text x="882" y="352.0" class="s" font-size="16" fill="#8AA6B8">RQL, C#, tests, screenshots</text><text x="882" y="374.0" class="s" font-size="16" fill="#8AA6B8">+ extensions and your tools</text><text x="600.0" y="494" text-anchor="middle" class="s" font-size="16" fill="#A8C2D2">unity-mcp-cli also installs the plugin, opens the project and runs batch-mode tests</text>
    <rect x="0" y="518" width="1200" height="2" fill="url(#rule)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="519" rx="18" fill="none" stroke="rgba(111,168,208,0.16)"/>
</svg>
