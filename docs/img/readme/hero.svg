<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="AI Game Developer for Unity: Skills, MCP tools and a CLI that connect AI agents to the Unity Editor and to your running game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="330" rx="20"/></clipPath>
    <path id="a1" d="M650 68 L770 165"/>
    <path id="a2" d="M890 68 L770 165"/>
    <path id="a3" d="M922 165 L770 165"/>
    <path id="a4" d="M890 262 L770 165"/>
    <path id="a5" d="M650 262 L770 165"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .ring { transform-origin: 770px 165px; animation: spin 28s linear infinite; }
    .ring.r2 { animation-duration: 44s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 770px 165px; animation: pulse 3.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .link { stroke-dasharray: 4 7; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="330" fill="url(#bg)"/>
    <rect width="1000" height="330" fill="url(#grid)"/>
    <circle cx="770" cy="165" r="220" fill="url(#glow)"/>
    <circle cx="120" cy="300" r="200" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <rect x="48" y="40" width="292" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="68" cy="56" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="82" y="61" font-size="15" font-weight="600" fill="#e2e8f0" letter-spacing=".5">EDITOR · RUNTIME · CLI</text>
      <text x="46" y="130" font-size="52" font-weight="700" fill="url(#title)" letter-spacing="-1">AI Game Developer</text>
      <text x="48" y="168" font-size="24" font-weight="600" fill="#f1f5f9">Unity Skills, MCP tools and a CLI</text>
      <text x="48" y="202" font-size="19" fill="#cbd5e1">Your AI agent builds, tests and debugs Unity</text>
      <text x="48" y="228" font-size="19" fill="#cbd5e1">projects, in the Editor and inside your game.</text>
      <rect x="48" y="252" width="300" height="46" rx="10" fill="#020617" fill-opacity="0.75" stroke="#334155"/>
      <text class="mono" x="66" y="281" font-size="18" fill="#94a3b8">$ <tspan fill="#f1f5f9">npm i -g </tspan><tspan fill="#67e8f9">unity-mcp-cli</tspan></text>
      <rect class="caret" x="326" y="266" width="9" height="20" fill="#67e8f9"/>
    </g>

    <!-- right: AI agents around the Unity project -->
    <g fill="none" stroke-width="2">
      <use href="#a1" class="link" stroke="#67e8f9" stroke-opacity=".75"/>
      <use href="#a2" class="link" stroke="#a5b4fc" stroke-opacity=".75"/>
      <use href="#a3" class="link" stroke="#e879f9" stroke-opacity=".75"/>
      <use href="#a4" class="link" stroke="#34d399" stroke-opacity=".75"/>
      <use href="#a5" class="link" stroke="#fbbf24" stroke-opacity=".75"/>
    </g>
    <g>
      <circle r="4" fill="#67e8f9"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="4" fill="#a5b4fc"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="4" fill="#e879f9"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
      <circle r="4" fill="#34d399"><animateMotion dur="2.8s" begin=".3s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
      <circle r="4" fill="#fbbf24"><animateMotion dur="2.5s" begin=".8s" repeatCount="indefinite"><mpath href="#a5"/></animateMotion></circle>
    </g>

    <circle class="ring" cx="770" cy="165" r="80" fill="none" stroke="#a5b4fc" stroke-opacity=".35" stroke-dasharray="2 10"/>
    <circle class="ring r2" cx="770" cy="165" r="100" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-dasharray="30 14"/>
    <g class="pulse">
      <rect x="700" y="122" width="140" height="86" rx="16" fill="#0b1020" stroke="url(#core)" stroke-width="2.5"/>
      <rect x="710" y="132" width="120" height="66" rx="10" fill="url(#core)" fill-opacity=".14"/>
      <text class="mono" x="770" y="162" text-anchor="middle" font-size="21" font-weight="700" fill="#f1f5f9">Unity</text>
      <text class="sans" x="770" y="186" text-anchor="middle" font-size="15" fill="#cbd5e1">Editor · Game</text>
    </g>

    <g class="sans" font-size="16" font-weight="600">
      <g transform="translate(650 68)"><rect x="-70" y="-19" width="140" height="38" rx="19" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Claude Code</text></g>
      <g transform="translate(890 68)"><rect x="-50" y="-19" width="100" height="38" rx="19" fill="#0f172a" stroke="#a5b4fc" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Codex</text></g>
      <g transform="translate(922 165)"><rect x="-52" y="-19" width="104" height="38" rx="19" fill="#0f172a" stroke="#e879f9" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Cursor</text></g>
      <g transform="translate(890 262)"><rect x="-56" y="-19" width="112" height="38" rx="19" fill="#0f172a" stroke="#34d399" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Copilot</text></g>
      <g transform="translate(650 262)"><rect x="-54" y="-19" width="108" height="38" rx="19" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".7"/><text y="6" text-anchor="middle" fill="#f1f5f9">Gemini</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="999" height="329" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
