<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Game Developer for Unity: Skills, MCP tools and a CLI that connect AI agents to the Unity Editor and to your running game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1238"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
    <path id="a1" d="M800 78 L930 180"/>
    <path id="a2" d="M1070 78 L930 180"/>
    <path id="a3" d="M1110 180 L930 180"/>
    <path id="a4" d="M1070 282 L930 180"/>
    <path id="a5" d="M800 282 L930 180"/>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, Menlo, monospace; }
    .ring { transform-origin: 930px 180px; animation: spin 28s linear infinite; }
    .ring.r2 { animation-duration: 44s; animation-direction: reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 930px 180px; animation: pulse 3.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .link { stroke-dasharray: 4 7; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="930" cy="180" r="240" fill="url(#glow)"/>
    <circle cx="150" cy="320" r="220" fill="url(#glow2)"/>

    <!-- left: title block -->
    <g class="sans">
      <rect x="64" y="56" width="300" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="82" cy="70" r="4" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="94" y="75" font-size="13" fill="#cbd5e1" letter-spacing=".4">UNITY EDITOR · RUNTIME · CLI</text>
      <text x="62" y="146" font-size="54" font-weight="700" fill="url(#title)" letter-spacing="-1">AI Game Developer</text>
      <text x="64" y="182" font-size="22" font-weight="600" fill="#e2e8f0">Unity Skills, MCP tools and a CLI</text>
      <text x="64" y="216" font-size="18" fill="#94a3b8">Let your AI agent build, test and debug a Unity</text>
      <text x="64" y="240" font-size="18" fill="#94a3b8">project — in the Editor and inside your game.</text>
      <rect x="64" y="266" width="290" height="44" rx="10" fill="#020617" fill-opacity="0.7" stroke="#334155"/>
      <text class="mono" x="84" y="294" font-size="16" fill="#94a3b8">$ <tspan fill="#e2e8f0">npm i -g </tspan><tspan fill="#67e8f9">unity-mcp-cli</tspan></text>
      <rect class="caret" x="324" y="279" width="8" height="18" fill="#67e8f9"/>
    </g>

    <!-- right: AI agents around the Unity project -->
    <g fill="none" stroke-width="1.6">
      <use href="#a1" class="link" stroke="#67e8f9" stroke-opacity=".7"/>
      <use href="#a2" class="link" stroke="#a5b4fc" stroke-opacity=".7"/>
      <use href="#a3" class="link" stroke="#e879f9" stroke-opacity=".7"/>
      <use href="#a4" class="link" stroke="#34d399" stroke-opacity=".7"/>
      <use href="#a5" class="link" stroke="#fbbf24" stroke-opacity=".7"/>
    </g>
    <g>
      <circle r="3.5" fill="#67e8f9"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
      <circle r="3.5" fill="#a5b4fc"><animateMotion dur="2.6s" begin=".5s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
      <circle r="3.5" fill="#e879f9"><animateMotion dur="2.2s" begin="1s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
      <circle r="3.5" fill="#34d399"><animateMotion dur="2.8s" begin=".3s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
      <circle r="3.5" fill="#fbbf24"><animateMotion dur="2.5s" begin=".8s" repeatCount="indefinite"><mpath href="#a5"/></animateMotion></circle>
    </g>

    <circle class="ring" cx="930" cy="180" r="78" fill="none" stroke="#a5b4fc" stroke-opacity=".35" stroke-dasharray="2 10"/>
    <circle class="ring r2" cx="930" cy="180" r="98" fill="none" stroke="#67e8f9" stroke-opacity=".18" stroke-dasharray="30 14"/>
    <g class="pulse">
      <rect x="868" y="140" width="124" height="80" rx="16" fill="#0b1020" stroke="url(#core)" stroke-width="2.5"/>
      <rect x="878" y="150" width="104" height="60" rx="10" fill="url(#core)" fill-opacity=".14"/>
      <text class="mono" x="930" y="176" text-anchor="middle" font-size="17" font-weight="700" fill="#e2e8f0">Unity</text>
      <text class="sans" x="930" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">Editor · Game</text>
    </g>

    <g class="sans" font-size="14" font-weight="600">
      <g transform="translate(800 78)"><rect x="-62" y="-17" width="124" height="34" rx="17" fill="#0f172a" stroke="#67e8f9" stroke-opacity=".6"/><text y="5" text-anchor="middle" fill="#e2e8f0">Claude Code</text></g>
      <g transform="translate(1070 78)"><rect x="-44" y="-17" width="88" height="34" rx="17" fill="#0f172a" stroke="#a5b4fc" stroke-opacity=".6"/><text y="5" text-anchor="middle" fill="#e2e8f0">Codex</text></g>
      <g transform="translate(1110 180)"><rect x="-46" y="-17" width="92" height="34" rx="17" fill="#0f172a" stroke="#e879f9" stroke-opacity=".6"/><text y="5" text-anchor="middle" fill="#e2e8f0">Cursor</text></g>
      <g transform="translate(1070 282)"><rect x="-50" y="-17" width="100" height="34" rx="17" fill="#0f172a" stroke="#34d399" stroke-opacity=".6"/><text y="5" text-anchor="middle" fill="#e2e8f0">Copilot</text></g>
      <g transform="translate(800 282)"><rect x="-48" y="-17" width="96" height="34" rx="17" fill="#0f172a" stroke="#fbbf24" stroke-opacity=".6"/><text y="5" text-anchor="middle" fill="#e2e8f0">Gemini</text></g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
