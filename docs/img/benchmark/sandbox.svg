<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Sandbox benchmark: tokens per task 169,190 with plain reflection tools vs 7,817 with RQL; tool calls per task 36.9 vs 1.9; tasks solved 66.7% vs 100%">
  <defs>
