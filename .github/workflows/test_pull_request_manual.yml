name: test-pull-request-manual

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to test (empty = test the branch this run was dispatched on)"
        required: false
        type: string
      sha:
        description: "With pr: the full 40-char head commit you reviewed. The run fails if the PR head is anything else."
        required: false
        type: string

run-name: "${{ inputs.pr != '' && format('licensed suite for PR #{0} at {1}', inputs.pr, inputs.sha) || '' }}"

# With pr set, every job below runs a pull request's code, which may come from a fork, and this
# repository's default token is write-scoped. Nothing that runs that code needs more than read.
# Job-level permissions REPLACE these, so only `resolve` and `report`, which never check out the
# pull request's code, widen them.
permissions:
  contents: read

# One run per branch at a time. On fork-tests that keeps each fork's run alone in the branch's cache
# scope, which `resolve` and `report` empty around it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolve what to test, ONCE. A fork PR's commits are fetchable from this repository
  # (refs/pull/<n>/head and /merge), so naming the PR runs the licensed suite against a fork's code
  # without granting that code the secrets on any other trigger.
  #
  # - Where: only from the fork-tests branch, and only while its .github/ matches main's. Fork code
  #   can write cache entries in the scope of the ref a run was dispatched on; main's scope is what
  #   release.yml and every PR run restore, fork-tests' scope nothing else reads.
  # - Review vs dispatch: `sha` is the head the maintainer reviewed. If the PR head is anything else
  #   when this job runs, nothing is tested; a push after this job cannot reach the tests either,
  #   because every job checks out the SHA pinned here, not a ref.
  # - A stale test merge: refs/pull/<n>/merge is rebuilt asynchronously and a read does not rebuild
  #   it, so it can lag the head. The merge commit is used only if its second parent IS the
  #   reviewed head; otherwise the head itself is tested, and the summary says which.
  resolve:
    name: resolve ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: write
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - id: resolve
        env:
          PR: ${{ inputs.pr }}
          EXPECTED: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref }}
          RUN_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then
            if [ -n "$EXPECTED" ]; then
              echo "::error::sha is only meaningful together with pr."
              exit 1
            fi
            echo "Testing \`$REF_NAME\` (no PR number given)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::pr must be a pull request number."; exit 1; }
          [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::With pr, sha must be the full lowercase 40-char head commit you reviewed."; exit 1; }

          if [ "$REF_NAME" != "refs/heads/fork-tests" ]; then
            echo "::error::With pr, dispatch on the fork-tests branch (--ref fork-tests), not $REF_NAME: fork code must not run in a cache scope other runs restore."
            exit 1
          fi
          github_tree() { gh api "repos/$REPO/git/trees/$1" --jq '.tree[] | select(.path == ".github") | .sha'; }
          if [ "$(github_tree "$RUN_SHA")" != "$(github_tree main)" ]; then
            echo "::error::.github/ on fork-tests differs from main. Bring the branch up to date, then dispatch again:"
            echo "gh api -X PATCH repos/$REPO/git/refs/heads/fork-tests -f sha=\$(gh api repos/$REPO/git/ref/heads/main --jq .object.sha)"
            exit 1
          fi

          pr_json=$(gh api "repos/$REPO/pulls/$PR")
          state=$(jq -r '.state' <<<"$pr_json")
          head=$(jq -r '.head.sha' <<<"$pr_json")
          if [ "$state" != "open" ]; then
            echo "::error::PR #$PR is $state."
            exit 1
          fi
          if [ "$head" != "$EXPECTED" ]; then
            echo "::error::PR #$PR head is now $head, not the $EXPECTED you reviewed. Review the new commits and dispatch again with sha=$head."
            exit 1
          fi

          # `mergeable` and `merge_commit_sha` are computed asynchronously; a GET schedules the
          # computation and returns null until it is done.
          for _ in 1 2 3 4 5 6 7 8 9; do
            [ "$(jq -r '.mergeable' <<<"$pr_json")" != "null" ] && break
            sleep 5
            pr_json=$(gh api "repos/$REPO/pulls/$PR")
          done
          mergeable=$(jq -r '.mergeable' <<<"$pr_json")
          base=$(jq -r '.base.sha' <<<"$pr_json")
          merge=$(jq -r '.merge_commit_sha // ""' <<<"$pr_json")
          if [ "$(jq -r '.head.sha' <<<"$pr_json")" != "$head" ]; then
            echo "::error::PR #$PR received a push while this job ran. Review it and dispatch again."
            exit 1
          fi

          ref="$head"
          kind="head commit"
          if [ "$mergeable" = "true" ] && [ -n "$merge" ]; then
            parents=$(gh api "repos/$REPO/git/commits/$merge" --jq '[.parents[].sha] | join(" ")')
            read -r parent1 parent2 _ <<<"$parents"
            if [ "$parent2" = "$head" ]; then
              ref="$merge"
              kind="test merge into the base branch"
              if [ "$parent1" != "$base" ]; then
                echo "::warning::The test merge was built on base $parent1; the base branch is now at $base."
              fi
            else
              echo "::warning::refs/pull/$PR/merge ($merge) is stale: its second parent is ${parent2:-missing}, not $head. Testing the head commit instead."
            fi
          elif [ "$mergeable" = "false" ]; then
            echo "::warning::PR #$PR conflicts with its base branch. Testing its head commit instead of a merge."
          else
            echo "::warning::GitHub has not computed a test merge for PR #$PR yet. Testing its head commit instead."
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          {
            echo "### Licensed suite for PR #$PR"
            echo ""
            echo "- reviewed head: \`$head\`"
            echo "- tested: \`$ref\` ($kind)"
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      # This branch's own .github/actions, verified above to match main's. Never the PR's tree.
      - uses: actions/checkout@v6
        if: steps.resolve.outputs.head != ''
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/delete-ref-caches
        if: steps.resolve.outputs.head != ''
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - uses: ./.github/actions/unity-tests-licensed
        if: steps.resolve.outputs.head != ''
        with:
          sha: ${{ steps.resolve.outputs.head }}
          state: pending
          description: Licensed suite running (test-pull-request-manual)
          token: ${{ github.token }}

  test-cli:
    needs: resolve
    uses: ./.github/workflows/test_cli.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  # --- UNITY TESTS ---
  # -------------------

  # --- EDIT MODE ---

  test-unity-2022-3-62f3-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "editmode"
    secrets: inherit

  test-unity-2023-2-22f1-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "editmode"
    secrets: inherit

  test-unity-6000-3-1f1-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "editmode"
    secrets: inherit

  test-unity-6000-6-3f1-editmode:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/6000.6.3f1"
      unityVersion: "6000.6.3f1"
      testMode: "editmode"
    secrets: inherit

  # --- PLAY MODE ---

  # test-unity-2022-3-62f3-playmode:
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: "./Unity-Tests/2022.3.62f3"
  #     unityVersion: "2022.3.62f3"
  #     testMode: "playmode"
  #   secrets: inherit

  # test-unity-2023-2-22f1-playmode:
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: "./Unity-Tests/2023.2.22f1"
  #     unityVersion: "2023.2.22f1"
  #     testMode: "playmode"
  #   secrets: inherit

  # test-unity-6000-3-1f1-playmode:
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: "./Unity-Tests/6000.3.1f1"
  #     unityVersion: "6000.3.1f1"
  #     testMode: "playmode"
  #   secrets: inherit

  # test-unity-6000-6-3f1-playmode:
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: "./Unity-Tests/6000.6.3f1"
  #     unityVersion: "6000.6.3f1"
  #     testMode: "playmode"
  #   secrets: inherit

  # --- STANDALONE ---

  test-unity-2022-3-62f3-standalone:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "standalone"
    secrets: inherit

  test-unity-2023-2-22f1-standalone:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "standalone"
    secrets: inherit

  test-unity-6000-3-1f1-standalone:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "standalone"
    secrets: inherit

  test-unity-6000-6-3f1-standalone:
    needs: resolve
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      projectPath: "./Unity-Tests/6000.6.3f1"
      unityVersion: "6000.6.3f1"
      testMode: "standalone"
    secrets: inherit

  # -------------------

  # This run is not attached to the PR (it ran on fork-tests, and a fork PR's own test-unity-* jobs
  # are skipped). So the verdict is the required `unity-tests-licensed` commit status on the
  # reviewed head commit. A later push is a new head SHA, which has no status until the next run.
  report:
    name: report to PR
    needs:
      - resolve
      - test-cli
      - test-unity-2022-3-62f3-editmode
      - test-unity-2023-2-22f1-editmode
      - test-unity-6000-3-1f1-editmode
      - test-unity-6000-6-3f1-editmode
      - test-unity-2022-3-62f3-standalone
      - test-unity-2023-2-22f1-standalone
      - test-unity-6000-3-1f1-standalone
      - test-unity-6000-6-3f1-standalone
    if: always() && needs.resolve.outputs.head != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      actions: write
    steps:
      - id: verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          TESTED: ${{ needs.resolve.outputs.ref }}
        run: |
          set -euo pipefail
          results=$(jq -r '[.[].result] | unique | join(",")' <<<"$NEEDS")
          case "$results" in
            success) state=success; desc="Licensed suite passed on ${TESTED:0:12}" ;;
            *cancelled*) state=error; desc="Licensed suite cancelled ($results)" ;;
            *) state=failure; desc="Licensed suite failed ($results)" ;;
          esac
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$desc" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/unity-tests-licensed
        with:
          sha: ${{ needs.resolve.outputs.head }}
          state: ${{ steps.verdict.outputs.state }}
          description: ${{ steps.verdict.outputs.description }}
          token: ${{ github.token }}

      - uses: ./.github/actions/delete-ref-caches
        if: always()
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}
