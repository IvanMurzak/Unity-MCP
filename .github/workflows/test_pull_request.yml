name: test-pull-request

on:
  workflow_dispatch:

  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]

jobs:
  save-event-file:
    runs-on: ubuntu-latest
    steps:
      - name: Save event file for publish workflow
        uses: actions/upload-artifact@v6
        with:
          name: Event File
          path: ${{ github.event_path }}

  # Guards issue #957: a NuGet pin may not change without bumping the asmdef gate generation,
  # or consumers upgrading from the previous release compile the new sources against their old
  # DLLs and dead-lock in Safe Mode. Static + license-free, so it runs on every PR in seconds.
  check-nuget-gate:
    name: nuget gate (issue #957)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check NuGet pins against the asmdef gate generation
        run: python .github/scripts/check_nuget_gate.py

  # The plugin's only engine-free C# tests: a plain xUnit project that compiles a chosen set of the
  # real plugin sources (Unity-MCP-Plugin/Tests~/EngineFree). No Unity licence, no editor, no Docker —
  # so unlike the game-ci legs below it also runs on fork PRs, in seconds. What it may and may not
  # compile in, and why, is documented in Unity-MCP-Plugin/Tests~/EngineFree/README.md.
  # TreatNoTestsAsError guards the vacuous case: a run that discovers zero tests fails instead of
  # reporting a green job.
  engine-free-tests:
    name: engine-free tests (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Unity-MCP-Plugin/Tests~/EngineFree/EngineFree.csproj -c Release --logger trx -- RunConfiguration.TreatNoTestsAsError=true

  test-cli:
    uses: ./.github/workflows/test_cli.yml

  # NOTE: the MCP server is no longer built from this repo — the plugin consumes the shared
  # GameDev-MCP-Server (https://github.com/IvanMurzak/GameDev-MCP-Server) release pinned by
  # McpServerManager.ServerVersion.

  # --- UNITY TESTS ---
  # -------------------

  # --- EDIT MODE ---

  test-unity-2022-3-62f3-editmode:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "editmode"
    secrets: inherit

  test-unity-2023-2-22f1-editmode:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "editmode"
    secrets: inherit

  test-unity-6000-3-1f1-editmode:
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "editmode"
    secrets: inherit

