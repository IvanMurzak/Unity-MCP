name: Publish MCP Registry Listing

# Publishes ./server.json, the one universal registry listing (see docs/agents/release.md,
# "MCP registry listing"). Dispatch only: a publish is public and each version publishes once.
# Re-dispatching after a registry preview data reset is safe. Never add per-engine listings
# (a spam-removal trigger).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # github-oidc login, no stored secret
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
    steps:
      # Ref guard: publish only the reviewed server.json on `main`.
      - name: Ref guard
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch on refs/heads/main (got $GITHUB_REF): gh workflow run publish_mcp_registry.yml --ref main"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: /server.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --fail-early --location --silent --show-error --remote-name-all "$base_url/$archive" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
