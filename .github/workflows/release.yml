name: release

# A release is cut ONLY by a manual dispatch of this workflow (software release-dispatch contract,
# `.taskflow/2026-09-03-chain-testing/05-release-dispatch-contract.md`). Merging a version bump to
# `main` publishes nothing. One run: full tests -> builds -> npm publish (unity-mcp-cli, via
# deploy.yml) -> tag + GitHub Release (the signed UPM tarball OpenUPM picks up) -> Discord ->
# post-publish registry verification.
#
#   gh workflow run release.yml -R IvanMurzak/Unity-MCP --ref main -f dry_run=true   # tests + builds, publishes nothing
#   gh workflow run release.yml -R IvanMurzak/Unity-MCP --ref main                   # real release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every test and build job but publish NOTHING (no npm, no tag, no GitHub Release, no Discord)."
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-cli:
    needs: [check-version-tag]
    uses: ./.github/workflows/test_cli.yml

  check-version-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.current-version }}
      prev_tag: ${{ steps.prev_tag.outputs.tag }}
      tag_exists: ${{ steps.tag_exists.outputs.exists }}
    steps:
      # Ref guard: a real release publishes only what is on `main`. A dry run may target any ref.
      - name: Ref guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::A real release must be dispatched on refs/heads/main (got $GITHUB_REF). Re-dispatch with --ref main, or pass -f dry_run=true."
            exit 1
          fi
          echo "ref=$GITHUB_REF dry_run=$DRY_RUN"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get version from package.json
        id: get_version
        uses: martinbeentjes/npm-get-version-action@v1.3.1
        with:
          path: Unity-MCP-Plugin/Packages/com.ivanmurzak.unity.mcp

      - name: Find previous version tag
        id: prev_tag
        uses: WyriHaximus/github-action-get-previous-tag@v2

      - name: Check if tag exists
        id: tag_exists
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: ${{ steps.get_version.outputs.current-version }}

      # Version guard: tags are BARE semver (no `v`). A real run on an already-released version
      # FAILS here, so a dispatch never "succeeds" having published nothing. A dry run warns and
      # continues, so tests + builds can be rehearsed on an already-tagged commit.
      - name: Version guard
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ steps.get_version.outputs.current-version }}
          TAG_EXISTS: ${{ steps.tag_exists.outputs.exists }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the version from Unity-MCP-Plugin/Packages/com.ivanmurzak.unity.mcp/package.json."
            exit 1
          fi
          if [ "$TAG_EXISTS" = "true" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::Tag $VERSION already exists. Dry run: continuing with tests and builds; nothing will be published."
            else
              echo "::error::Tag $VERSION already exists - this version is already released. Bump the version (commands/bump-version.ps1) and merge it to main before dispatching a release."
              exit 1
            fi
          fi
          echo "version=$VERSION tag_exists=$TAG_EXISTS dry_run=$DRY_RUN"

  # Generates release notes (release.md) in parallel with tests/builds.
  # The artifact is consumed by release-unity-plugin's atomic publish step.
  prepare-release-notes:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=${{ needs.check-version-tag.outputs.version }}
          prev_tag=${{ needs.check-version-tag.outputs.prev_tag }}
          repo_url="https://github.com/${GITHUB_REPOSITORY}"
          today=$(date +'%B %e, %Y')

          echo "repo_url: $repo_url"
          echo "today: $today"

          echo "# AI Game Developer (Unity MCP) $version" > release.md
          echo "**Released:** *$today*" >> release.md

          echo "" >> release.md
          echo "---" >> release.md
          echo "" >> release.md

          if [ -n "$prev_tag" ]; then
            echo "## Comparison" >> release.md
            echo "See every change: [Compare $prev_tag...$version]($repo_url/compare/$prev_tag...$version)" >> release.md

            echo "" >> release.md
            echo "---" >> release.md
            echo "" >> release.md

            echo "## Commit Summary (Newest → Oldest)" >> release.md
            for sha in $(git log --pretty=format:'%H' $prev_tag..HEAD); do
              username=$(gh api repos/${GITHUB_REPOSITORY}/commits/$sha --jq '.author.login // .commit.author.name' 2>/dev/null || true)
              if [ -z "$username" ]; then
                username=$(git log -1 --pretty=format:'%an' $sha)
              fi
              message=$(git log -1 --pretty=format:'%s' $sha)
              short_sha=$(git log -1 --pretty=format:'%h' $sha)
              echo "- [\`$short_sha\`]($repo_url/commit/$sha) — $message by @$username" >> release.md
            done
          fi

      - name: Upload release notes as artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: ./release.md

  build-unity-installer:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # License: game-ci consumes the stored UNITY_LICENSE (.ulf) secret directly
      # on the test/build steps below. No per-run web scraping.

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: ./Installer/Library
          key: Library-Unity-Installer

      - name: Test Unity Installer (EditMode)
        uses: game-ci/unity-test-runner@08fd329f00a18efa297140b14ac28ebce742759e # node24 runtime (PR #304); revert to @v4 once game-ci moves the tag
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          projectPath: ./Installer
          unityVersion: 2022.3.62f3
          customImage: "unityci/editor:ubuntu-2022.3.62f3-base-3"
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Installer EditMode Test Results
          artifactsPath: artifacts-installer-editmode
          customParameters: -CI true -GITHUB_ACTIONS true

      - name: Clean Unity artifacts and reset git state
        run: |
          # Force remove Unity generated files with restricted permissions
          sudo rm -rf ./Installer/Logs/ || true
          sudo rm -rf ./Installer/Temp/ || true
          sudo rm -rf ./artifacts-installer-editmode/ || true

          # Reset tracked files to their committed state...
          git reset --hard HEAD
          # ...and remove untracked Unity junk (e.g. batch-mode error.html/error.png)
          # that would otherwise leave the tree dirty. -d removes stray dirs; we do NOT
          # pass -x, so gitignored caches like ./Installer/Library are preserved.
          git clean -fd
          echo "Cleaned Unity artifacts and reset git state"
          git status --porcelain

      - name: Export Unity Package
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ./Installer
          unityVersion: 2022.3.62f3
          customImage: "unityci/editor:ubuntu-2022.3.62f3-base-3"
          buildName: AI-Game-Dev-Installer
          buildsPath: build
          buildMethod: com.IvanMurzak.Unity.MCP.Installer.PackageExporter.ExportPackage
          customParameters: -CI true -GITHUB_ACTIONS true
          # This job only exports a .unitypackage; it never reads Application.version.
          # Default Semantic versioning runs a git-dirty check that fails when Unity
          # leaves stray untracked files behind, so disable versioning entirely.
          versioning: None

      - name: Upload Unity Package as artifact
        uses: actions/upload-artifact@v6
        with:
          name: unity-installer-package
          path: ./Installer/build/AI-Game-Dev-Installer.unitypackage

  # NOTE: the MCP server is no longer built or released from this repo — the plugin consumes
  # the shared GameDev-MCP-Server (https://github.com/IvanMurzak/GameDev-MCP-Server) release
  # pinned by McpServerManager.ServerVersion.

  # Builds the signed UPM package (.tgz with package/.attestation.p7m) in parallel
  # with tests/builds and uploads it as a `signed-upm-package` artifact for the
  # atomic release publish in release-unity-plugin.
  #
  # HARD-GATE: this job is NOT continue-on-error. Missing UPM signing secrets fail
  # fast and the release pipeline halts — no GitHub Release is created without a
  # signed UPM tarball. This reverses PR #776's soft-fail design (see
  # docs/openupm-signing.md for the blocking-semantics rationale).
  #
  # Required repo secrets (configure via `gh secret set --repo IvanMurzak/Unity-MCP <NAME>`):
  #   - UPM_SERVICE_ACCOUNT_KEY_ID
  #   - UPM_SERVICE_ACCOUNT_KEY_SECRET
  #   - UPM_ORG_ID
  # See https://openupm.com/docs/signing-upm-packages.html for the procedure.
  build-signed-upm-package:
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    env:
      UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
      UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
      UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
      PACKAGE_DIR: Unity-MCP-Plugin/Packages/com.ivanmurzak.unity.mcp
      DIST_DIR: /tmp/signed-upm-dist
    steps:
      - name: Verify signing secrets are configured
        run: |
          missing=()
          [ -z "$UPM_SERVICE_ACCOUNT_KEY_ID" ]     && missing+=("UPM_SERVICE_ACCOUNT_KEY_ID")
          [ -z "$UPM_SERVICE_ACCOUNT_KEY_SECRET" ] && missing+=("UPM_SERVICE_ACCOUNT_KEY_SECRET")
          [ -z "$UPM_ORG_ID" ]                     && missing+=("UPM_ORG_ID")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::UPM signing secrets are not configured (%s). The release pipeline is hard-gated on signing — see docs/openupm-signing.md for setup.\n' "${missing[*]}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log package metadata
        run: |
          package_name="$(jq -r '.name' "$PACKAGE_DIR/package.json")"
          package_version="$(jq -r '.version' "$PACKAGE_DIR/package.json")"

          printf 'Package name: %s\n' "$package_name"
          printf 'Package version: %s\n' "$package_version"

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh -o install.sh
          bash install.sh
          echo "$HOME/.upm/bin" >> "$GITHUB_PATH"

      - name: Verify Unity UPM CLI
        run: upm --help

      - name: Sign package
        run: |
          mkdir -p "$DIST_DIR"
          upm pack "./$PACKAGE_DIR" --organization-id "$UPM_ORG_ID" --destination "$DIST_DIR"

      - name: Verify signed package contains attestation
        run: |
          shopt -s nullglob
          archives=("$DIST_DIR"/*.tgz "$DIST_DIR"/*.tar.gz)
          if [ "${#archives[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed package archive, found %s: %s\n' "${#archives[@]}" "${archives[*]:-<none>}" >&2
            exit 1
          fi

          archive="${archives[0]}"
          archive_basename="$(basename "$archive")"
          # OpenUPM consumes the asset via the `githubReleaseAssetName: 'com.ivanmurzak.unity.mcp-'`
          # prefix documented in docs/openupm-signing.md. Enforce the contract here so a future
          # `upm pack` naming change fails CI loudly instead of silently breaking OpenUPM pickup.
          if [[ "$archive_basename" != com.ivanmurzak.unity.mcp-* ]]; then
            printf 'Signed archive basename %q does not begin with the OpenUPM-expected prefix com.ivanmurzak.unity.mcp- (see docs/openupm-signing.md)\n' "$archive_basename" >&2
            exit 1
          fi

          archive_entries="$(tar -tzf "$archive")"
          grep -qx 'package/package.json'      <<<"$archive_entries"
          grep -qx 'package/.attestation.p7m'  <<<"$archive_entries"

          printf 'Signed archive: %s\n' "$archive_basename"
          tar -xOzf "$archive" package/package.json | jq '{name, version}'

      - name: Upload signed UPM package as artifact
        uses: actions/upload-artifact@v6
        with:
          name: signed-upm-package
          path: /tmp/signed-upm-dist/*.tgz

  # --- ENGINE-FREE TESTS ---
  # The same two license-free gates test_pull_request.yml runs on every PR, so the release runs the
  # FULL suite (recipes copied from there; the chain-feed steps are omitted because a release
  # dispatch carries no lock and they are a no-op without one).

  check-nuget-gate:
    name: nuget gate (issue #957)
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check NuGet pins against the asmdef gate generation
        run: python .github/scripts/check_nuget_gate.py

  engine-free-tests:
    name: engine-free tests (.NET 8)
    runs-on: ubuntu-latest
    needs: [check-version-tag]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Unity-MCP-Plugin/Tests~/EngineFree/EngineFree.csproj -c Release --logger trx -- RunConfiguration.TreatNoTestsAsError=true

  # --- UNITY TESTS ---
  # -------------------

  # --- EDIT MODE ---

  test-unity-2022-3-62f3-editmode:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "editmode"
    secrets: inherit

  test-unity-2023-2-22f1-editmode:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "editmode"
    secrets: inherit

  test-unity-6000-3-1f1-editmode:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "editmode"
    secrets: inherit

  # --- PLAY MODE ---

  # test-unity-2022-3-62f3-playmode:
  #   needs: [build-unity-installer]
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: './Unity-Tests/2022.3.62f3'
  #     unityVersion: '2022.3.62f3'
  #     testMode: 'playmode'
  #   secrets: inherit

  # test-unity-2023-2-22f1-playmode:
  #   needs: [build-unity-installer]
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: './Unity-Tests/2023.2.22f1'
  #     unityVersion: '2023.2.22f1'
  #     testMode: 'playmode'
  #   secrets: inherit

  # test-unity-6000-3-1f1-playmode:
  #   needs: [build-unity-installer]
  #   uses: ./.github/workflows/test_unity_plugin.yml
  #   with:
  #     projectPath: './Unity-Tests/6000.3.1f1'
  #     unityVersion: '6000.3.1f1'
  #     testMode: 'playmode'
  #   secrets: inherit

  # --- STANDALONE ---

  test-unity-2022-3-62f3-standalone:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2022.3.62f3"
      unityVersion: "2022.3.62f3"
      testMode: "standalone"
    secrets: inherit

  test-unity-2023-2-22f1-standalone:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/2023.2.22f1"
      unityVersion: "2023.2.22f1"
      testMode: "standalone"
    secrets: inherit

  test-unity-6000-3-1f1-standalone:
    needs: [build-unity-installer]
    uses: ./.github/workflows/test_unity_plugin.yml
    with:
      projectPath: "./Unity-Tests/6000.3.1f1"
      unityVersion: "6000.3.1f1"
      testMode: "standalone"
    secrets: inherit

  # -------------------

  # npm publish of unity-mcp-cli (deploy.yml) — the FIRST side effect, gated on the complete test
  # set and every build. It runs BEFORE the tag + GitHub Release so a failed publish leaves no tag
  # behind and the same version can simply be re-dispatched; deploy.yml skips the publish when the
  # exact version is already on npm, so a re-dispatch after a later failure is idempotent.
  deploy:
    needs: [
        check-version-tag,
        test-cli,
        check-nuget-gate,
        engine-free-tests,
        prepare-release-notes,
        build-unity-installer,
        build-signed-upm-package,
        test-unity-2022-3-62f3-editmode,
        # test-unity-2022-3-62f3-playmode,
        test-unity-2022-3-62f3-standalone,
        test-unity-2023-2-22f1-editmode,
        # test-unity-2023-2-22f1-playmode,
        test-unity-2023-2-22f1-standalone,
        test-unity-6000-3-1f1-editmode,
        # test-unity-6000-3-1f1-playmode,
        test-unity-6000-3-1f1-standalone,
      ]
    if: inputs.dry_run != true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.check-version-tag.outputs.version }}
    secrets: inherit

  # Atomic publish point — gated on EVERY prerequisite (tests, builds, signed
  # UPM package, release notes, npm publish). Downloads all asset artifacts and creates the
  # GitHub Release + tag with the full asset set in a SINGLE
  # softprops/action-gh-release@v2 call so a failed upload cannot strand the
  # release with incomplete assets. Signing failure → no release (hard gate).
  # OpenUPM picks the signed UPM tarball up from this GitHub Release.
  release-unity-plugin:
    runs-on: ubuntu-latest
    needs: [
        check-version-tag,
        test-cli,
        check-nuget-gate,
        engine-free-tests,
        prepare-release-notes,
        build-unity-installer,
        build-signed-upm-package,
        test-unity-2022-3-62f3-editmode,
        # test-unity-2022-3-62f3-playmode,
        test-unity-2022-3-62f3-standalone,
        test-unity-2023-2-22f1-editmode,
        # test-unity-2023-2-22f1-playmode,
        test-unity-2023-2-22f1-standalone,
        test-unity-6000-3-1f1-editmode,
        # test-unity-6000-3-1f1-playmode,
        test-unity-6000-3-1f1-standalone,
        deploy,
      ]
    if: inputs.dry_run != true
    outputs:
      version: ${{ needs.check-version-tag.outputs.version }}
      success: ${{ steps.mark_success.outputs.success }}
      release_notes: ${{ steps.read_notes.outputs.release_body }}
    steps:
      - name: Download release notes artifact
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ./release-notes

      - name: Download Unity installer artifact
        uses: actions/download-artifact@v7
        with:
          name: unity-installer-package
          path: ./assets

      - name: Download signed UPM package artifact
        uses: actions/download-artifact@v7
        with:
          name: signed-upm-package
          path: ./assets

      - name: List assembled release assets
        run: |
          set -e
          echo "Release notes:"
          ls -la ./release-notes
          echo ""
          echo "Release assets:"
          ls -la ./assets

      - name: Read release notes into job output
        id: read_notes
        run: |
          set -e
          # Expose the release notes body as a job output so downstream jobs
          # (publish_discord) can consume it without re-downloading the artifact.
          # Use a randomized delimiter so a release-notes line that happens to
          # match the sentinel cannot terminate the heredoc early.
          DELIM="ENDOFRELEASEBODY_$(openssl rand -hex 16)"
          {
            printf 'release_body<<%s\n' "$DELIM"
            cat ./release-notes/release.md
            printf '\n%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Create Tag and Release with all assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check-version-tag.outputs.version }}
          name: ${{ needs.check-version-tag.outputs.version }}
          body_path: ./release-notes/release.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ./assets/AI-Game-Dev-Installer.unitypackage
            ./assets/com.ivanmurzak.unity.mcp-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark publish success
        id: mark_success
        run: |
          # The action-gh-release step above is the atomic publish — if it
          # succeeded the release exists with every asset attached. Surface
          # `success=true` for downstream jobs that gate on the release.
          echo "success=true" >> "$GITHUB_OUTPUT"

  publish_discord:
    runs-on: ubuntu-latest
    needs:
      [
        release-unity-plugin,
        deploy,
      ]
    if: |
      always() &&
      inputs.dry_run != true &&
      needs.release-unity-plugin.result == 'success'
    steps:
      - name: Send Release Notes to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_NOTES_WEBHOOK }}
          RELEASE_NOTES: ${{ needs.release-unity-plugin.outputs.release_notes }}
          VERSION: ${{ needs.release-unity-plugin.outputs.version }}
        run: |
          # Get the release notes from environment variables
          # (Using env vars avoids shell quoting issues with apostrophes in commit messages)
          release_notes="$RELEASE_NOTES"
          version="$VERSION"

          # Convert usernames to GitHub profile links
          # Convert "by @username" to "by [@username](https://github.com/username)"
          release_notes_with_links=$(echo "$release_notes" | sed -E 's/by @([A-Za-z0-9_-]+)/by [@\1](https:\/\/github.com\/\1)/g')

          # Remove horizontal separators (---) and clean up extra blank lines
          # 1. Remove lines containing only --- and whitespace
          # 2. Remove lines that contain only whitespace
          # 3. Compress multiple consecutive empty lines into one
          release_notes_cleaned=$(echo "$release_notes_with_links" | \
            sed '/^[[:space:]]*---[[:space:]]*$/d' | \
            sed 's/^[[:space:]]*$//' | \
            sed '/^$/N;/^\n$/d')

          # Create the release URL
          release_url="https://github.com/${{ github.repository }}/releases/tag/${version}"

          # Append the release link to the notes
          full_message="${release_notes_cleaned}"$'\n\n'"📦 **[View Full Release](${release_url})**"

          # Discord has a 2000 character limit, so we'll truncate if needed
          if [ ${#full_message} -gt 2000 ]; then
            # Remove lines from the end until it fits, keeping the link
            link_text=$'\n\n'"📦 **[View Full Release](${release_url})**"
            # The truncated message is reassembled below as `<notes>` + `\n...` + `<link>`,
            # so the ellipsis line costs 4 more characters on top of the link. Budget for
            # BOTH, otherwise the assembled message reaches 2004 chars and Discord rejects
            # the whole announcement with a 400 — silently, since the step does not gate on
            # the response. Godot-MCP and Unreal-MCP carry the identical budget.
            ellipsis_text=$'\n'"..."
            max_length=$((2000 - ${#link_text} - ${#ellipsis_text}))

            # Split into lines and rebuild until we exceed the limit
            truncated_notes=""
            while IFS= read -r line; do
              test_notes="${truncated_notes}${line}"$'\n'
              if [ ${#test_notes} -gt $max_length ]; then
                break
              fi
              truncated_notes="$test_notes"
            done <<< "$release_notes_cleaned"

            # Add ellipsis on its own line if we truncated
            full_message="${truncated_notes}"$'\n'"...${link_text}"
          fi

          # Create JSON payload for Discord webhook
          # flags: 4 sets the SUPPRESS_EMBEDS flag to suppress embeds/link previews.
          # See: https://discord.com/developers/docs/resources/channel#create-message
          json_payload=$(jq -n \
            --arg content "$full_message" \
            '{content: $content, flags: 4}')

          # Send to the Discord webhook and GATE ON THE RESPONSE.
          #
          # curl exits 0 on an HTTP error status, so a bare `curl -X POST` proves only
          # that a request was attempted -- never that Discord accepted it. Capture the
          # status explicitly: 400 (payload over the 2000-char limit), 429 (rate
          # limited) and 401/404 (revoked or wrong webhook) all used to leave this job
          # green with no announcement posted and nothing in the log to say so. That
          # blind spot is how the truncation-budget bug fixed above went unnoticed.
          #
          # `--retry 3` covers only what a retry can fix -- curl's transient set (429,
          # 5xx and timeouts), honouring Discord's `Retry-After` header -- and
          # `--retry-max-time` bounds it. A 4xx other than 429 is a permanent rejection
          # and is never retried, and neither is a refused connection (that would need
          # `--retry-connrefused`); both fail fast and loudly below. Accepted tradeoff:
          # a webhook execute has no idempotency key, so a retry whose predecessor was
          # actually processed (response lost in flight) can post the announcement
          # twice. A duplicate announcement is strictly better than a missing one.
          #
          # The webhook URL is a credential: it is never echoed and `-v` is never
          # passed (curl's own `-S` error text names at most the host). The response
          # body IS printed -- it is Discord's JSON error object, the single most
          # useful thing for whoever debugs the next failure.
          response_file="$(mktemp)"
          curl_exit=0
          http_code=$(curl -sS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$json_payload" \
            --retry 3 \
            --retry-max-time 60 \
            -o "$response_file" \
            -w '%{http_code}') || curl_exit=$?

          # Safe to fail here: nothing downstream depends on this job and the release is
          # already published, so a red step cannot block or undo it. It DOES redden the
          # workflow run conclusion (and the release badge) -- that is the intended
          # visibility, and the message below states exactly what did and did not ship.
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Discord announcement for version ${version} was NOT delivered (curl exit ${curl_exit}). The release itself is published; only the announcement is missing."
            exit 1
          fi

          case "$http_code" in
            2??)
              echo "Release notes accepted by Discord for version ${version} (HTTP ${http_code})."
              ;;
            *)
              echo "::error::Discord REJECTED the release notes for version ${version} (HTTP ${http_code}). The release itself is published; only the announcement is missing."
              echo "Discord response body:"
              head -c 2000 "$response_file"
              echo ""
              exit 1
              ;;
          esac

  # Post-publish verification (moved here from the software repo's local release pipeline, which
  # waited out a 30-minute registry-indexing window after `release.yml` before anything consumed
  # the version). The run is green ONLY if every channel serves the exact version: the GitHub
  # Release carries both assets, npm serves unity-mcp-cli@<version>, and OpenUPM has indexed
  # com.ivanmurzak.unity.mcp@<version> from the Release (observed lag 2-6 min; capped at 45).
  verify-published:
    runs-on: ubuntu-latest
    needs: [check-version-tag, deploy, release-unity-plugin]
    if: inputs.dry_run != true
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check-version-tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: GitHub Release carries both assets
        run: |
          set -euo pipefail
          gh release view "$VERSION" -R "$GITHUB_REPOSITORY" --json tagName,isDraft,assets > release.json
          jq '{tagName, isDraft, assets: [.assets[].name]}' release.json
          if [ "$(jq -r '.isDraft' release.json)" != "false" ]; then
            echo "::error::GitHub Release $VERSION is a draft."; exit 1
          fi
          if [ "$(jq '[.assets[].name | select(. == "AI-Game-Dev-Installer.unitypackage")] | length' release.json)" != "1" ]; then
            echo "::error::GitHub Release $VERSION is missing AI-Game-Dev-Installer.unitypackage."; exit 1
          fi
          if [ "$(jq '[.assets[].name | select(startswith("com.ivanmurzak.unity.mcp-"))] | length' release.json)" != "1" ]; then
            echo "::error::GitHub Release $VERSION is missing the signed com.ivanmurzak.unity.mcp-*.tgz."; exit 1
          fi

      - name: npm serves the CLI version
        run: |
          set -uo pipefail
          name="$(jq -r '.name' cli/package.json)"
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            code="$(curl -sS -o npm.json -w '%{http_code}' "https://registry.npmjs.org/${name}/${VERSION}")" || code="curl-failed"
            if [ "$code" = "200" ] && [ "$(jq -r '.version' npm.json 2>/dev/null)" = "$VERSION" ]; then
              echo "npm: ${name}@${VERSION} is published."; break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::npm does not serve ${name}@${VERSION} after 10 minutes (last HTTP ${code})."; exit 1
            fi
            echo "npm: ${name}@${VERSION} not yet visible (HTTP ${code}); retrying in 30s"
            sleep 30
          done

      - name: OpenUPM has indexed the plugin version
        run: |
          set -uo pipefail
          name="$(jq -r '.name' Unity-MCP-Plugin/Packages/com.ivanmurzak.unity.mcp/package.json)"
          deadline=$(( $(date +%s) + 2700 ))
          while :; do
            code="$(curl -sS -o upm.json -w '%{http_code}' "https://package.openupm.com/${name}")" || code="curl-failed"
            if [ "$code" = "200" ] && [ "$(jq --arg v "$VERSION" -r '.versions[$v].version // empty' upm.json 2>/dev/null)" = "$VERSION" ]; then
              echo "OpenUPM: ${name}@${VERSION} is indexed."; break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::OpenUPM has not indexed ${name}@${VERSION} after 45 minutes (last HTTP ${code}). Check https://openupm.com/packages/${name}/ build status."; exit 1
            fi
            echo "OpenUPM: ${name}@${VERSION} not yet indexed (HTTP ${code}); retrying in 60s"
            sleep 60
          done

  # Cleanup job to remove build artifacts after the atomic publish + deploy.
  # Re-pointed at release-unity-plugin (was: publish-mcp-server, publish-unity-installer)
  # since those post-release publish jobs collapsed into release-unity-plugin.
  # Skipped on a dry run so the built installer + signed UPM tarball stay inspectable.
  cleanup-artifacts:
    runs-on: ubuntu-latest
    needs: [release-unity-plugin, deploy]
    if: always() && inputs.dry_run != true
    steps:
      - name: Delete Unity Package artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: unity-installer-package
          failOnError: false
        continue-on-error: true

      - name: Delete signed UPM package artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: signed-upm-package
          failOnError: false
        continue-on-error: true

      - name: Delete release notes artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: release-notes
          failOnError: false
        continue-on-error: true
