name: deploy

# Reusable child of release.yml ONLY: the sole path to an npm publish is a manual dispatch of
# release.yml (which runs the full test set first). No workflow_dispatch here: a direct dispatch
# would publish without those gates. (It publishes via npm OIDC Trusted Publishing - no NPM_TOKEN -
# and the OIDC workflow_ref of a workflow_call is the CALLER, release.yml.)
on:
  workflow_call:
    inputs:
      version: { required: true, type: string }

# NOTE: the MCP server NuGet dotnet-tool (`unity-mcp-server`) and Docker image
# (`ivanmurzakdev/unity-mcp-server`) publish jobs were removed — the server now lives in the
# shared GameDev-MCP-Server repo (https://github.com/IvanMurzak/GameDev-MCP-Server), which owns
# the binary/Docker (`aigamedeveloper/mcp-server`) release channels. Those legacy channels stop
# receiving updates.
jobs:
  deploy-cli-to-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: |
          version=${{ inputs.version }}
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Set package version
        run: |
          cd cli
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          cd cli
          npm ci

      - name: Build
        run: |
          cd cli
          npm run build

      - name: Test
        run: |
          cd cli
          npm test

      # Idempotent: a re-dispatch of release.yml after a later job failed must not fail here on
      # "cannot publish over the previously published version".
      - name: Check whether this version is already on npm
        id: npm_exists
        run: |
          cd cli
          name="$(jq -r '.name' package.json)"
          version="${{ steps.version.outputs.version }}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")"
          echo "npm ${name}@${version}: HTTP ${code}"
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "::notice::${name}@${version} is already on npm - skipping publish." ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP ${code} from the npm registry for ${name}@${version}."; exit 1 ;;
          esac

      - name: Publish to npm with provenance
        if: steps.npm_exists.outputs.exists != 'true'
        run: |
          cd cli
          npm publish --access public --provenance
