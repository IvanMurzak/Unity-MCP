name: publish-test-results

# Runs after test-pull-request completes — uses write token from the base
# repo so it works for fork PRs (where the PR workflow token is read-only).

on:
  workflow_run:
    workflows: ["test-pull-request"]
    types: [completed]

permissions:
  actions: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skipped for chain dispatches (workflow_dispatch): they upload no `Test results for …` artifacts
    # (chain mode keeps only the JSON leg records), so publishing would post a neutral "0 tests"
    # `Test Results` check that REPLACES the PR run's real report on the same head commit.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.event != 'workflow_dispatch'

    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      # A fork PR's Unity legs run nothing and upload no results (see test_unity_plugin.yml). Publishing
      # then would post a passing "Test Results" check with 0 tests, a second false green on the PR.
      - name: Find test result files
        id: results
        shell: bash
        run: |
          count=$(find artifacts -path 'artifacts/Test results for */*' -name '*.xml' -type f | wc -l)
          echo "Found $count test result file(s)."
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish Test Results
        if: steps.results.outputs.found == 'true'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/Test results for */**/*.xml
          comment_mode: failures
          # Disable build-over-build comparison: it triggers a paginated GET on
          # /repos/{owner}/{repo}/commits/{before_sha}/check-runs that
          # intermittently returns 401 ("Bad credentials") even with valid
          # GITHUB_TOKEN + correct permissions. The first probe call with
          # per_page=1 succeeds; the immediately following per_page=100 fetch
          # 401s on the same URL with the same token. Disabling compare_to_
          # earlier_commit skips the problematic call entirely. The previous
          # comment_mode 'changes in failures' depended on this comparison,
          # so it's been simplified to 'failures' (always comment on failures).
          compare_to_earlier_commit: false

  # `unity-tests-licensed` is the one status that says the Unity suite really ran with a license on
  # this head commit. Require it in the ruleset: the test-unity-* checks alone pass on a fork PR
  # without compiling anything.
  # - same-repository PR: the suite ran here with secrets, so the status mirrors this run.
  # - fork PR: nothing ran, so the status is pending until a maintainer reviews the head and runs
  #   test_pull_request_manual.yml with pr + sha, which overwrites it. It is never posted over a
  #   status that manual run already left, so the order of the two does not matter.
  licensed-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - env:
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          MANUAL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/test_pull_request_manual.yml
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          post() {
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f context=unity-tests-licensed \
              -f state="$1" -f target_url="$2" -f description="$3" > /dev/null
            echo "unity-tests-licensed on $HEAD_SHA: $1 ($3)"
          }
          if [ "$HEAD_REPO" = "$REPO" ]; then
            if [ "$CONCLUSION" = "success" ]; then
              post success "$RUN_URL" "Licensed suite passed (test-pull-request)"
            else
              post failure "$RUN_URL" "test-pull-request concluded $CONCLUSION"
            fi
            exit 0
          fi
          existing=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses" --paginate \
            --jq '[.[] | select(.context == "unity-tests-licensed")] | length' | awk '{n += $1} END {print n + 0}')
          if [ "$existing" -gt 0 ]; then
            echo "unity-tests-licensed already set on $HEAD_SHA; leaving it."
            exit 0
          fi
          post pending "$MANUAL_URL" "Fork PR: maintainer must run test-pull-request-manual with pr and sha=${HEAD_SHA:0:12}"
        shell: bash
