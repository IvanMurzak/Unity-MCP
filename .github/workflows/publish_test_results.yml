name: publish-test-results

# Runs after test-pull-request completes — uses write token from the base
# repo so it works for fork PRs (where the PR workflow token is read-only).

on:
  workflow_run:
    workflows: ["test-pull-request"]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Skipped for chain dispatches (workflow_dispatch): they upload no `Test results for …` artifacts
    # (chain mode keeps only the JSON leg records), so publishing would post a neutral "0 tests"
    # `Test Results` check that REPLACES the PR run's real report on the same head commit.
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.event != 'workflow_dispatch'

    steps:
      - name: Download all test result artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      # A fork PR's Unity jobs are skipped and upload no results (see test_unity_plugin.yml). Publishing
      # then would post a passing "Test Results" check with 0 tests, a second false green on the PR.
      # A same-repository run still publishes with no files, so a run whose legs all died before
      # writing results keeps reporting that.
      - name: Publish Test Results
        if: hashFiles('artifacts/Test results for */**/*.xml') != '' || github.event.workflow_run.head_repository.full_name == github.repository
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          files: artifacts/Test results for */**/*.xml
          comment_mode: failures
          # Disable build-over-build comparison: it triggers a paginated GET on
          # /repos/{owner}/{repo}/commits/{before_sha}/check-runs that
          # intermittently returns 401 ("Bad credentials") even with valid
          # GITHUB_TOKEN + correct permissions. The first probe call with
          # per_page=1 succeeds; the immediately following per_page=100 fetch
          # 401s on the same URL with the same token. Disabling compare_to_
          # earlier_commit skips the problematic call entirely. The previous
          # comment_mode 'changes in failures' depended on this comparison,
          # so it's been simplified to 'failures' (always comment on failures).
          compare_to_earlier_commit: false

      # `unity-tests-licensed` is the required check for the Unity suite. On a same-repository PR the
      # suite ran here with secrets, so it mirrors this run. A fork PR's is left unreported (GitHub
      # then shows it as expected) until test_pull_request_manual.yml sets it.
      - uses: actions/checkout@v6
        if: always() && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - uses: ./.github/actions/unity-tests-licensed
        if: always() && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository
        with:
          sha: ${{ github.event.workflow_run.head_sha }}
          state: ${{ github.event.workflow_run.conclusion == 'success' && 'success' || 'failure' }}
          description: test-pull-request concluded ${{ github.event.workflow_run.conclusion }}
          target-url: ${{ github.event.workflow_run.html_url }}
          token: ${{ github.token }}
