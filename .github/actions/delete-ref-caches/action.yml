name: "Delete a ref's caches"
description: "Delete every Actions cache entry saved under one git ref"

# test_pull_request_manual.yml runs fork code from the fork-tests branch. That code can save cache
# entries in the branch's scope; nothing else reads that scope, and this empties it before and after
# each run so one fork's run never restores what another fork's run left behind.

inputs:
  ref:
    description: "Full ref whose cache scope to empty, e.g. refs/heads/fork-tests"
    required: true
  token:
    description: "Token with actions: write"
    required: true

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        REF: ${{ inputs.ref }}
      run: |
        set -euo pipefail
        ids=$(gh api --paginate "repos/$REPO/actions/caches?per_page=100" -f ref="$REF" -X GET --jq '.actions_caches[].id')
        count=0
        for id in $ids; do
          gh api -X DELETE "repos/$REPO/actions/caches/$id" > /dev/null
          count=$((count + 1))
        done
        echo "Deleted $count cache entr$([ "$count" -eq 1 ] && echo y || echo ies) under $REF."
